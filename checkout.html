<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>B Market - Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>B Market</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="product.html">Products</a>

            <a href="cart.html">Cart 🛒</a>

        </nav>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-container">

        <h2>Checkout</h2>


        <div class="checkout-content">


            <!-- CUSTOMER DETAILS -->

            <section class="customer-box">

                <h3>Delivery Details</h3>

                <form id="checkoutForm">


                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10 digit mobile number"
                        pattern="[0-9]{10}"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="House number, street, village..."
                        required
                    ></textarea>


                    <label for="city">
                        City / Village
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city or village"
                        required
                    >


                    <label for="pincode">
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter PIN code"
                        pattern="[0-9]{6}"
                        required
                    >


                    <button type="submit">
                        Continue to Payment
                    </button>


                </form>

            </section>


            <!-- ORDER SUMMARY -->

            <section class="order-box">

                <h3>Order Summary</h3>

                <div id="checkoutItems">

                </div>


                <hr>


                <div class="total">

                    <strong>
                        Total:
                    </strong>

                    ₹<span id="checkoutTotal">
                        0
                    </span>

                </div>

            </section>


        </div>

    </main>


    <script src="checkout.js"></script>

</body>

</html>
