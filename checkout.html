<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Market - Checkout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
    <script src="api-config.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">
                <img src="image/m logo.png" alt="B Market Logo" style="height: 38px; width: auto; object-fit: contain;">
                <h1 style="margin: 0;">B Market</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="category.html">Categories</a>
            <a href="cart.html">Cart 🛒</a>
            <a href="order-history.html">Orders</a>
            <a href="contact.html">Contact</a>
            <div id="headerUserSlot" class="header-user-area" style="display: inline-block; margin-left: 10px;">
                <a href="login.html" class="btn-flipkart-login">Login</a>
            </div>
        </nav>
    </header>

    <!-- CHECKOUT -->
    <main class="checkout-container">
        <h2>Delivery &amp; Checkout</h2>

        <div class="checkout-content">
            <!-- CUSTOMER DETAILS -->
            <section class="customer-box">
                <h3>Delivery Details</h3>

                <form id="checkoutForm">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>

                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>

                    <label for="email">Email Address *</label>
                    <input type="email" id="email" placeholder="Enter your email" required>

                    <label for="address">Delivery Address *</label>
                    <textarea id="address" placeholder="House number, street, village/area..." required></textarea>

                    <label for="city">City / Village *</label>
                    <input type="text" id="city" placeholder="Enter city or village" required>

                    <label for="pincode">PIN Code *</label>
                    <input type="text" id="pincode" placeholder="Enter 6-digit PIN code" pattern="[0-9]{6}" required>

                    <button type="submit">
                        Continue to Payment →
                    </button>
                </form>
            </section>

            <!-- ORDER SUMMARY -->
            <section class="order-box">
                <h3>Order Summary</h3>
                <div id="checkoutItems"></div>
                <hr>
                <div class="total">
                    <strong>Total Amount:</strong>
                    <span>₹<span id="checkoutTotal">0</span></span>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 B Market. All Rights Reserved. Fresh Local Products &amp; Auxiliary Marketplace.</p>
    </footer>

    <script src="auth-state.js"></script>
    <script src="checkout.js"></script>

</body>

</html>
