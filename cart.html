<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - B Market</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-section {
            max-width: 900px;
            margin: 40px auto 60px;
            padding: 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .cart-header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .cart-header-title h2 {
            margin: 0;
            color: #1e293b;
            font-size: 26px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin: 0 0 6px 0;
            font-size: 17px;
            color: #0f172a;
        }

        .cart-info p {
            margin: 3px 0;
            font-size: 14px;
            color: #64748b;
        }

        .cart-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-buttons button {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cart-buttons button:hover {
            background: #e2e8f0;
        }

        .cart-buttons button:last-child {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
            margin-left: 10px;
        }

        .cart-buttons button:last-child:hover {
            background: #fecaca;
        }

        .cart-total {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .cart-total h3 {
            font-size: 22px;
            color: #1e293b;
            margin: 0;
        }

        .cart-total span {
            color: #2e7d32;
            font-weight: 800;
        }

        .cart-total button {
            background: #fb641b;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(251, 100, 27, 0.3);
            transition: transform 0.1s, background 0.2s;
        }

        .cart-total button:hover {
            background: #e65100;
            transform: translateY(-1px);
        }
    </style>
    <script src="api-config.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">
                <img src="image/m logo.png" alt="B Market Logo" style="height: 38px; width: auto; object-fit: contain;">
                <h1 style="margin: 0;">B Market</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="category.html">Categories</a>
            <a href="cart.html" style="color: #ffe500; font-weight: 800;">Cart 🛒</a>
            <a href="order-history.html">Orders</a>
            <a href="contact.html">Contact</a>
            <div id="headerUserSlot" class="header-user-area" style="display: inline-block; margin-left: 10px;">
                <a href="login.html" class="btn-flipkart-login">Login</a>
            </div>
        </nav>
    </header>

    <section class="cart-section">
        <div class="cart-header-title">
            <h2>🛒 My Shopping Cart</h2>
            <a href="product.html" style="color: #2e7d32; font-weight: 600; text-decoration: none; font-size: 14px;">+ Add More Items</a>
        </div>

        <div id="cartItems"></div>

        <div class="cart-total">
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button onclick="goToCheckout()">
                Proceed to Checkout →
            </button>
        </div>
    </section>

    <footer>
        <p>© 2026 B Market. All Rights Reserved. Fresh Local Products &amp; Auxiliary Marketplace.</p>
    </footer>

    <script src="auth-state.js"></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>

</body>

</html>
