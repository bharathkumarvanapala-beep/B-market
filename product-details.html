<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Details - B Market</title>

    <link rel="stylesheet" href="product-details.css">

</head>

<body>

    <header>
        <h1>B Market</h1>
    </header>

    <main class="product-details">

        <img id="productImage"
             src="image/fruit.jpg" alt="Fresh Fruits" width="300px"height="200px">
             

        <div class="details">

            <h2 id="productName"></h2>

            <p id="productDescription"></p>

            <h3 id="productPrice"></h3>

            <button id="addCart">
                Add to Cart
            </button>

            <br><br>

            <a href="index.html">
                ← Back to Products
            </a>

        </div>

    </main>

    <script src="product-details.js"></script>

</body>

</html>
