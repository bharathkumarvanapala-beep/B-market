[build]
  publish = "."
  functions = "netlify/functions"

# B Market Netlify Functions - Enquiry Route
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200
  force = true

[[redirects]]
  from = "/api/enquiry/*"
  to = "/.netlify/functions/enquiry/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
